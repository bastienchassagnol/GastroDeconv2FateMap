[project]
name = "gastrodeconv2fatemap-python"
version = "0.1.0"
description = "Python analysis environment for GastroDeconv2FateMap (scripts only, not installable)."
requires-python = ">=3.13"
dependencies = [
    "bionty>=2.4.2",
    "ipykernel>=7.3.0",
    "pertpy[tcoda]>=1.1.1",
]

[dependency-groups]
dev = [
    "pyrefly>=0.36.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88
indent-width = 4
src = ["Python", "tests"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"Python/**/*.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pyrefly]
python-version = "3.13"
python-platform = "linux"
project-includes = ["Python/**/*.py", "tests/**/*.py"]
project-excludes = [
    "**/.venv",
    "**/__pycache__",
    "**/.ruff_cache",
    "**/node_modules",
    "**/*venv/**",
]
search-path = ["."]
use-ignore-files = true
python-interpreter-path = ".venv/bin/python"
